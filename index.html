<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0e1a" />
    <title>LIFE 2.0</title>
    <meta property="og:title" content="LIFE 2.0 — Dit personlige livsdashboard" />
    <meta property="og:description" content="Premium personligt dashboard til din hverdag" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
  </head>
  <body>
    <div id="boot-status" style="min-height:100vh;background:#070a14;color:#e2e8f0;display:grid;place-items:center;padding:24px;font-family:system-ui,sans-serif;text-align:center"><div><h1 style="font-size:28px;margin:0 0 12px">LIFE 2.0</h1><p id="boot-message">Starter appen…</p></div></div>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (event) {
        var message = event.message || (event.target && event.target.src) || 'Ukendt indlæsningsfejl';
        var box = document.getElementById('boot-status'), label = document.getElementById('boot-message');
        if (box && label) { label.textContent = 'Appen kunne ikke indlæses: ' + message; box.style.display = 'grid'; }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var box = document.getElementById('boot-status'), label = document.getElementById('boot-message');
        if (box && label) { label.textContent = 'Opstartsfejl: ' + String(event.reason); box.style.display = 'grid'; }
      });
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
